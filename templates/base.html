{% load static %}

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SolcanLab</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- App CSS -->

    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  </head>

  <body class="{% block body_class %}{% endblock %}">
    <!-- NAVBAR -->

    {% block navbar %}
    <nav class="navbar navbar-expand-lg navbar-dark navbar-solcan py-3">
      <div class="container-fluid px-4">
        <!-- LOGO -->

        <a class="navbar-brand fw-bold" href="/dashboard/">
          <img
            src="{% static 'img/solcanlab-logo.jpg' %}"
            alt="SolcanLab"
            class="navbar-logo bg-white rounded px-2 py-1 me-2"
          />

          <span class="visually-hidden"> SolcanLab </span>
        </a>

        {% if request.user.is_authenticated %}

        <div class="d-flex align-items-center text-white">
          <!-- USER -->

          <div class="me-4 text-end">
            <div class="fw-semibold">{{ request.user.username }}</div>

            <small class="text-light"> {{ request.user.role }} </small>
          </div>

          <!-- LOGOUT -->

          <a href="/logout/" class="btn btn-danger btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>

            Salir
          </a>
        </div>

        {% endif %}
      </div>
    </nav>
    {% endblock %}

    <!-- CONTENIDO -->

    <div
      class="container main-container {% block main_container_class %}{% endblock %}"
    >
      {% block content %} {% endblock %}
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/notifications.js' %}"></script>
  </body>
</html>
